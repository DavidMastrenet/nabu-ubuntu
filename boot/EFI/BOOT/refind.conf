timeout 2
use_nvram false
scanfor manual
resolution 1600 2560
rotation 3
showtools reboot,shutdown
# The theme provides the icon set. Without it rEFInd searches for icons, warns
# "no icon" and stalls on a placeholder before the menu appears.
include themes/refind-theme-regular/theme.conf
menuentry "Ubuntu" {
    loader /EFI/ubuntu/6.14.11-camera-autofocus.efi
    icon /EFI/BOOT/themes/refind-theme-regular/icons/256-96/os_ubuntu.png
}
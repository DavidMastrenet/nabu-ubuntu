[connection]
# The ath10k/wcn3990 firmware has no board MAC on nabu, so the driver assigns a
# random address every boot. "stable" derives one from the hostname and the
# connection UUID, keeping it constant across reboots.
wifi.cloned-mac-address=stable

[device]
# Do not randomise the address used for background scans either.
wifi.scan-rand-mac-address=no

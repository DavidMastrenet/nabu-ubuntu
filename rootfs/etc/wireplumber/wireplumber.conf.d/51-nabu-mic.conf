monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.platform-sound.HiFi__Mic__source" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        api.alsa.period-size = 1024
        api.alsa.period-num = 4
        api.alsa.disable-mmap = true
      }
    }
  }
]
